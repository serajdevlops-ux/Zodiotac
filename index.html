<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Zodiotac AI - 24/7 Edition</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121212; color: white; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        #chatbox { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 12px 16px; border-radius: 12px; max-width: 80%; word-wrap: break-word; line-height: 1.4; }
        .user-msg { background-color: #0b93f6; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-msg { background-color: #2c2c2e; align-self: flex-start; border-bottom-left-radius: 2px; }
        #input-area { display: flex; padding: 12px; background-color: #1c1c1e; border-top: 1px solid #2c2c2e; }
        input { flex: 1; padding: 12px 16px; border: none; border-radius: 20px; outline: none; background: #2c2c2e; color: white; font-size: 16px; }
        button { padding: 12px 20px; margin-left: 10px; background-color: #0b93f6; color: white; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; }
        button:active { opacity: 0.8; }
    </style>
</head>
<body>

    <div id="chatbox">
        <div class="message ai-msg">Hello! I am Zodiotac. My dual-server 24/7 architecture is online.</div>
    </div>

    <div id="input-area">
        <input type="text" id="userInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        // PASTE YOUR TWO CLOUDFLARE LINKS HERE
        const URL_SHIFT_1 = "https://try-watt-impaired-intl.trycloudflare.com/chat";
        const URL_SHIFT_2 = "https://mount-heart-thinking-experts.trycloudflare.com/chat";

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        // Custom fetch function that times out if the server is dead
        async function fetchWithTimeout(url, options, timeout = 6000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            const response = await fetch(url, { ...options, signal: controller.signal });
            clearTimeout(id);
            return response;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, 'user-msg');
            input.value = '';

            const requestOptions = {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: message })
            };

            try {
                // Try the first server
                let response = await fetchWithTimeout(URL_SHIFT_1, requestOptions);
                if (!response.ok) throw new Error("Server 1 failed");
                let data = await response.json();
                addMessage(data.reply, 'ai-msg');
            } catch (error1) {
                console.log("Shift 1 is offline. Rerouting to Shift 2...");
                try {
                    // Failover to the second server
                    let response2 = await fetchWithTimeout(URL_SHIFT_2, requestOptions);
                    let data2 = await response2.json();
                    addMessage(data2.reply, 'ai-msg');
                } catch (error2) {
                    addMessage("⚠️ Both Colab shifts are currently offline. Please restart a notebook.", 'ai-msg');
                }
            }
        }

        function addMessage(text, className) {
            const chatbox = document.getElementById('chatbox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatbox.appendChild(msgDiv);
            chatbox.scrollTop = chatbox.scrollHeight;
        }
    </script>
</body>
</html>
