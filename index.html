<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Zodiotac AI</title>
    <style>
        :root {
            --bg-color: #131314;
            --surface-color: #1e1f20;
            --surface-hover: #2d2e30;
            --text-primary: #e3e3e3;
            --text-secondary: #c4c7c5;
            --accent-gradient: linear-gradient(135deg, #8ab4f8, #c58af9, #f28b82);
            --user-bubble: #2b2c2f;
            --border-color: #333537;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-primary); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Header */
        header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background-color: var(--bg-color); border-bottom: 1px solid var(--border-color); font-size: 18px; font-weight: 500; }
        .logo-container { display: flex; align-items: center; gap: 10px; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; }
        
        /* Chatbox */
        #chatbox { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; max-width: 800px; width: 100%; margin: 0 auto; }
        
        .message-row { display: flex; gap: 16px; width: 100%; max-width: 100%; }
        .message-row.user { justify-content: flex-end; }
        
        .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; flex-shrink: 0; }
        .ai-avatar { background: var(--accent-gradient); color: #131314; }
        
        .message { padding: 4px 0; line-height: 1.6; font-size: 15px; word-wrap: break-word; }
        .user-msg { background-color: var(--user-bubble); padding: 12px 18px; border-radius: 18px; max-width: 75%; border-bottom-right-radius: 4px; }
        .ai-msg { color: var(--text-primary); max-width: calc(100% - 48px); }

        /* Thinking animation */
        .typing-indicator { display: flex; align-items: center; gap: 6px; padding: 8px 0; }
        .typing-dot { width: 8px; height: 8px; background: #8ab4f8; border-radius: 50%; animation: pulse 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

        /* Input Container */
        #input-area-wrapper { padding: 16px; background-color: var(--bg-color); display: flex; justify-content: center; }
        #input-container { display: flex; align-items: center; background-color: var(--surface-color); border: 1px solid var(--border-color); border-radius: 28px; padding: 8px 16px; width: 100%; max-width: 800px; }
        input { flex: 1; background: transparent; border: none; outline: none; color: var(--text-primary); font-size: 16px; padding: 8px; }
        input::placeholder { color: var(--text-secondary); }
        button { background: var(--surface-hover); color: var(--text-primary); border: none; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #3c4043; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">✨ Zodiotac AI</div>
    </header>

    <div id="chatbox">
        <div class="message-row">
            <div class="avatar ai-avatar">Z</div>
            <div class="message ai-msg">Hello! I'm Zodiotac, powered by Llama 3. How can I help you today?</div>
        </div>
    </div>

    <div id="input-area-wrapper">
        <div id="input-container">
            <input type="text" id="userInput" placeholder="Ask Zodiotac anything..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            </button>
        </div>
    </div>

    <script>
        // These links remain identical every time because LocalTunnel locks your custom subdomain!
        const URL_SHIFT_1 = "https://zodiotac-primary-ai.loca.lt/chat";
        const URL_SHIFT_2 = "https://zodiotac-backup-ai.loca.lt/chat";

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function fetchWithTimeout(url, options, timeout = 6000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            const response = await fetch(url, { ...options, signal: controller.signal });
            clearTimeout(id);
            return response;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            addUserMessage(message);
            input.value = '';

            const typingId = showThinkingState();

            const requestOptions = {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: message })
            };

            let replyText = "⚠️ Both servers are currently offline.";
            try {
                let response = await fetchWithTimeout(URL_SHIFT_1, requestOptions);
                if (!response.ok) throw new Error();
                let data = await response.json();
                replyText = data.reply;
            } catch (e1) {
                try {
                    let response2 = await fetchWithTimeout(URL_SHIFT_2, requestOptions);
                    let data2 = await response2.json();
                    replyText = data2.reply;
                } catch (e2) {
                    replyText = "⚠️ Unable to connect to backend servers.";
                }
            }

            removeThinkingState(typingId);
            addAIMessage(replyText);
        }

        function addUserMessage(text) {
            const chatbox = document.getElementById('chatbox');
            const row = document.createElement('div');
            row.className = 'message-row user';
            row.innerHTML = `<div class="message user-msg">${escapeHtml(text)}</div>`;
            chatbox.appendChild(row);
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        function addAIMessage(text) {
            const chatbox = document.getElementById('chatbox');
            const row = document.createElement('div');
            row.className = 'message-row';
            row.innerHTML = `<div class="avatar ai-avatar">Z</div><div class="message ai-msg">${escapeHtml(text)}</div>`;
            chatbox.appendChild(row);
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        function showThinkingState() {
            const chatbox = document.getElementById('chatbox');
            const row = document.createElement('div');
            row.className = 'message-row';
            row.id = 'thinking-' + Date.now();
            row.innerHTML = `
                <div class="avatar ai-avatar">Z</div>
                <div class="message ai-msg">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>`;
            chatbox.appendChild(row);
            chatbox.scrollTop = chatbox.scrollHeight;
            return row.id;
        }

        function removeThinkingState(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
