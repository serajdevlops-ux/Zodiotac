<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Zodiotac AI</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121212; color: white; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        #chatbox { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 12px 16px; border-radius: 12px; max-width: 80%; word-wrap: break-word; line-height: 1.4; }
        .user-msg { background-color: #0b93f6; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-msg { background-color: #2c2c2e; align-self: flex-start; border-bottom-left-radius: 2px; }
        #input-area { display: flex; padding: 12px; background-color: #1c1c1e; border-top: 1px solid #2c2c2e; }
        input { flex: 1; padding: 12px 16px; border: none; border-radius: 20px; outline: none; background: #2c2c2e; color: white; font-size: 16px; }
        button { padding: 12px 20px; margin-left: 10px; background-color: #0b93f6; color: white; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; }
        button:active { opacity: 0.8; }
    </style>
</head>
<body>

    <div id="chatbox">
        <div class="message ai-msg">Hello! I am Zodiotac AI, built completely from scratch using PyTorch. Ask me something!</div>
    </div>

    <div id="input-area">
        <input type="text" id="userInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        // REPLACE THIS WITH YOUR CLOUDFLARE URL FROM COLAB
        const AI_API_URL = "https://forecast-sole-brief-generations.trycloudflare.com/chat";

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, 'user-msg');
            input.value = '';

            try {
                const response = await fetch(AI_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: message })
                });
                const data = await response.json();
                addMessage(data.reply, 'ai-msg');
            } catch (error) {
                addMessage("⚠️ Couldn't connect to Colab backend. Make sure your notebook is running!", 'ai-msg');
            }
        }

        function addMessage(text, className) {
            const chatbox = document.getElementById('chatbox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatbox.appendChild(msgDiv);
            chatbox.scrollTop = chatbox.scrollHeight;
        }
    </script>
</body>
</html>
