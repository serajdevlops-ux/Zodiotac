name: Build HTML to APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Set up Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Cordova & Native Dependencies
      run: |
        npm install -g cordova

    - name: Create Clean Cordova Project
      run: |
        # Create project in a temporary workspace folder to avoid structure conflicts
        cordova create temp_app com.zodiotac.app Zodiotac
        cd temp_app
        
        # Add Android platform
        cordova platform add android@12.0.1

    - name: Inject Custom App Files & SVG Icon
      run: |
        cd temp_app
        
        # Replace default www contents with your custom Zodiotac app files
        rm -rf www/*
        cp ../index.html www/index.html
        
        # Ensure resources directory exists
        mkdir -p resources
        
        # If you saved your icon as icon.svg in your repo root, copy it over. 
        # (Falls back gracefully if you name it icon.svg in your repo root)
        if [ -f ../icon.svg ]; then
          cp ../icon.svg resources/icon.svg
        fi

        # Dynamically inject clean config.xml with correct <widget> root and SVG icon support
        cat << 'EOF' > config.xml
        <?xml version='1.0' encoding='utf-8'?>
        <widget id="com.zodiotac.app" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <name>Zodiotac</name>
            <description>Zodiotac AI Mobile Application</description>
            <author email="dev@zodiotac.internal" href="https://zodiotac.internal">Zodiotac Team</author>
            <content src="index.html" />
            <access origin="*" />
            <allow-intent href="http://*/*" />
            <allow-intent href="https://*/*" />
            <platform name="android">
                <allow-intent href="market:/*" />
                <icon src="resources/icon.svg" />
            </platform>
        </widget>
        EOF

    - name: Build Android Release APK
      run: |
        cd temp_app
        cordova build android --release

    - name: Upload Built APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Zodiotac-Release-APK
        path: temp_app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
