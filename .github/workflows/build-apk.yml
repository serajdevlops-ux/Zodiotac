name: Build HTML to APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Exact Cordova-Compatible Gradle (8.1.1)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.1.1'

    - name: Install Android SDK Platform 33 & Build Tools 33.0.2
      run: |
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
        ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2"

    - name: Install Cordova
      run: npm install -g cordova@12.0.0

    - name: Create Clean Cordova Project
      run: |
        cordova create temp_app com.zodiotac.app Zodiotac
        cd temp_app
        cordova platform add android@12.0.1

    - name: Inject Custom App Files & Rasterize Icon
      run: |
        cd temp_app
        
        # Replace default www contents with custom app files
        rm -rf www/*
        cp ../index.html www/index.html
        
        # Ensure resources directory exists
        mkdir -p resources
        
        # Install rsvg-convert to safely convert SVG to PNG
        sudo apt-get update && sudo apt-get install -y librsvg2-bin
        
        # Convert the SVG to a PNG (or fallback to the JPG) so Android accepts it
        if [ -f ../icon.svg ]; then
          rsvg-convert -w 512 -h 512 ../icon.svg -o resources/icon.png
        elif [ -f ../1000155117.jpg ]; then
          convert ../1000155117.jpg -resize 512x512 resources/icon.png
        fi

        # Dynamically inject clean config.xml pointing to the newly generated PNG
        cat << 'EOF' > config.xml
        <?xml version='1.0' encoding='utf-8'?>
        <widget id="com.zodiotac.app" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <name>Zodiotac</name>
            <description>Zodiotac AI Mobile Application</description>
            <author email="dev@zodiotac.internal" href="https://zodiotac.internal">Zodiotac Team</author>
            <content src="index.html" />
            <access origin="*" />
            <allow-intent href="http://*/*" />
            <allow-intent href="https://*/*" />
            <platform name="android">
                <allow-intent href="market:/*" />
                <!-- Pointing strictly to the rasterized PNG to prevent AAPT2 crashes -->
                <icon src="resources/icon.png" />
            </platform>
        </widget>
        EOF

    - name: Build Android Release APK
      run: |
        cd temp_app
        cordova build android --release -- --packageType=apk

    - name: Upload Built APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Zodiotac-Release-APK
        path: temp_app/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
