name: Build HTML to APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create App & Build APK
      run: |
        cordova create zodiotac_app com.zodiotac.app Zodiotac
        rm -rf zodiotac_app/www/*
        cp index.html zodiotac_app/www/
        cd zodiotac_app
        cordova platform add android
        cordova build android

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zodiotac-app-apk
        path: zodiotac_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
