<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c20"/>
      <stop offset="50%" stop-color="#15102a"/>
      <stop offset="100%" stop-color="#06040a"/>
    </linearGradient>

    <!-- Z Symbol Gradient -->
    <linearGradient id="zGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#0088ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>

    <!-- Spark Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="4"/>

  <!-- Subtle Outer Glow Ring -->
  <rect x="20" y="20" width="472" height="472" rx="104" ry="104" fill="none" stroke="url(#zGrad)" stroke-opacity="0.2" stroke-width="8"/>

  <!-- Futuristic "Z" Neural Path -->
  <g filter="url(#glow)">
    <path d="M 140 160 
             L 370 160 
             C 390 160 400 175 390 190 
             L 180 330 
             L 370 330 
             C 385 330 395 340 395 352 
             C 395 365 385 372 370 372 
             L 140 372 
             C 120 372 110 357 120 342 
             L 330 202 
             L 140 202 
             C 125 202 115 192 115 180 
             C 115 168 125 160 140 160 Z" 
          fill="url(#zGrad)"/>

    <!-- AI Spark Accent top-right -->
    <path d="M 370 120 
             Q 370 145 395 145 
             Q 370 145 370 170 
             Q 370 145 345 145 
             Q 370 145 370 120 Z" 
          fill="#00d2ff"/>

    <!-- Small Spark Accent bottom-left -->
    <path d="M 140 380 
             Q 140 395 155 395 
             Q 140 395 140 410 
             Q 140 395 125 395 
             Q 140 395 140 380 Z" 
          fill="#7000ff"/>
  </g>
</svg>
