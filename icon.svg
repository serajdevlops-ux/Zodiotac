<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- App Icon Background: Rich Deep Obsidian Dark -->
  <rect width="512" height="512" rx="115" fill="#0d0d0f"/>
  
  <!-- Outer Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="url(#core-grad)" opacity="0.08" filter="blur(20px)"/>

  <!-- Orbital Ring 1 (Tilted Ellipse) -->
  <g transform="rotate(-30 256 256)">
    <ellipse cx="256" cy="256" rx="160" ry="70" fill="none" stroke="url(#core-grad)" stroke-width="12" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Orbital Ring 2 (Counter-Tilted Ellipse) -->
  <g transform="rotate(45 256 256)">
    <ellipse cx="256" cy="256" rx="170" ry="60" fill="none" stroke="url(#core-grad)" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- Central Core Object (The 'Z' Spark Matrix) -->
  <path d="M256 160C202.98 160 160 202.98 160 256C160 309.02 202.98 352 256 352C309.02 352 352 309.02 352 256C352 202.98 309.02 160 256 160ZM256 312C224.53 312 199 286.47 199 255C199 223.53 224.53 198 256 198C287.47 198 313 223.53 313 255C313 286.47 287.47 312 256 312Z" fill="url(#core-grad)"/>

  <!-- Core Energy Node -->
  <circle cx="256" cy="256" r="38" fill="#0d0d0f"/>
  <circle cx="256" cy="256" r="20" fill="url(#core-grad)"/>

  <!-- Gradient Definition (Electric Blue to Neon Violet/Coral Accent) -->
  <defs>
    <linearGradient id="core-grad" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>
</svg>
